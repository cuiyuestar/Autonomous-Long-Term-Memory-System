[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "altm"
version = "0.1.0"
description = "Autonomous Long-Term Memory system for agent attention management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [
  { name = "ALTM Contributors" }
]
dependencies = [
  "jieba>=0.42.1",
  "pydantic>=2.0"
]

[project.scripts]
altm = "altm.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyright>=1.1"
]
mcp = [
  "mcp>=1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/altm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
