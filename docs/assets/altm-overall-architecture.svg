      .eyebrow { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 1.2px; fill: #0369a1; }
      .section { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-title { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-sub { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 600 11px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #334155; }
      .micro { font: 400 10px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .container { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .sky { fill: #eff6ff; stroke: #38bdf8; stroke-width: 1.25; }
      .indigo { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.25; }
      .mint { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.25; }
      .amber { fill: #fffbeb; stroke: #fbbf24; stroke-width: 1.25; }
      .slate { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.25; marker-end: url(#arrow-slate); }
      .line-sky { fill: none; stroke: #0284c7; stroke-width: 1.5; marker-end: url(#arrow-sky); }
      .line-indigo { fill: none; stroke: #4f46e5; stroke-width: 1.5; marker-end: url(#arrow-indigo); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="928" rx="20" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="40" y="38" class="eyebrow">ALTM / OVERALL ARCHITECTURE</text>
  <text x="40" y="72" class="title">自主经验涌现与长期记忆演化</text>
  <text x="40" y="96" class="subtitle">当前任务提供线索，记忆沿全文、向量与关系图路径被激活；引用和反馈继续改变后续生命周期。</text>

